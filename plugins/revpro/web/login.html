<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revpro — sign in</title>
<style>
  :root{
    --bg:#0c1118; --panel:#131a24; --line:#22304a; --text:#d7e2ef; --dim:#7d8fa8;
    --accent:#4cc38a; --accent2:#5bb0f0; --danger:#e5717b; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  .card{width:min(92vw,380px);background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:28px 26px}
  h1{font-family:var(--mono);font-size:20px;margin:0 0 2px;color:var(--accent)}
  h1 .dim{color:var(--dim);font-weight:400}
  p.sub{margin:0 0 22px;color:var(--dim);font-size:13px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}
  input{width:100%;padding:9px 11px;border-radius:6px;border:1px solid var(--line);
        background:var(--bg);color:var(--text);font-size:14px;font-family:var(--mono)}
  input:focus{outline:none;border-color:var(--accent2)}
  button{width:100%;margin-top:18px;padding:10px;border-radius:6px;border:1px solid var(--accent);
         background:transparent;color:var(--accent);font-size:14px;font-family:var(--mono);cursor:pointer}
  button:hover{background:var(--accent);color:var(--bg)}
  a.oidc{display:block;margin-top:14px;padding:10px;border-radius:6px;border:1px solid var(--accent2);
         color:var(--accent2);text-align:center;text-decoration:none;font-family:var(--mono);font-size:14px}
  a.oidc:hover{background:var(--accent2);color:var(--bg)}
  .err{margin:0 0 14px;padding:9px 11px;border:1px solid var(--danger);border-radius:6px;
       color:var(--danger);font-size:13px;word-break:break-word}
  .sep{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;margin-top:16px}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
  <div class="card">
    <h1>revpro<span class="dim"> / web</span></h1>
    <p class="sub">nginx reverse-proxy manager</p>
    {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
    {{if .Local}}
    <form method="post" action="/login">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autofocus required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    {{end}}
    {{if and .Local .OIDC}}<div class="sep">or</div>{{end}}
    {{if .OIDC}}<a class="oidc" href="/oidc/start">Sign in with OIDC</a>{{end}}
  </div>
</body>
</html>
