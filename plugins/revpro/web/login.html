<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revpro — sign in</title>
<style>
  :root{
    color-scheme:light dark;
    --accent:#56775f; --accent-dk:#94af9b;
    --bg:#f5f5f5; --surface:#ffffff; --fg:#111111;
    --fg-2:rgba(17,17,17,.66); --fg-3:rgba(17,17,17,.6);
    --line:rgba(0,0,0,.13); --line-soft:rgba(0,0,0,.06);
    --a:var(--accent); --on-accent:#ffffff; --bad:#b23a2b;
    --font-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"Fira Code",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --grain-opacity:.035;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111111; --surface:#1a1a1a; --fg:#f2f2f2;
      --fg-2:rgba(242,242,242,.64); --fg-3:rgba(242,242,242,.52);
      --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.07);
      --a:var(--accent-dk); --on-accent:#101a12; --bad:#e0705e;
      --grain-opacity:.05;
    }
  }
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.6;
       -webkit-font-smoothing:antialiased}
  ::selection{background:var(--a);color:var(--on-accent)}
  :focus-visible{outline:2px solid var(--a);outline-offset:2px}
  .grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:var(--grain-opacity);
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
  .grid-lines{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(to right,var(--line-soft) 1px,transparent 1px),
                     linear-gradient(to bottom,var(--line-soft) 1px,transparent 1px);
    background-size:60px 60px}
  .card{width:min(92vw,380px);background:var(--surface);border:1px solid var(--line);padding:2rem 1.85rem}
  .brand{display:flex;align-items:center;gap:.85rem;margin-bottom:.4rem}
  .brand__mark{display:grid;place-items:center;width:2.1rem;height:2.1rem;
    background:var(--a);color:var(--on-accent);font-family:var(--font-mono);
    font-size:.8rem;font-weight:600}
  h1{font-size:1.05rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
  p.sub{margin:0 0 1.6rem;font-family:var(--font-mono);font-size:.6875rem;
    text-transform:uppercase;letter-spacing:.18em;color:var(--fg-3)}
  label{display:block;margin:.9rem 0 .3rem;font-family:var(--font-mono);font-size:.625rem;
    font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--fg-3)}
  input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);background:var(--bg);
    color:var(--fg);font-family:var(--font-mono);font-size:.875rem;border-radius:0}
  input:focus{outline:none;border-color:var(--a)}
  button{width:100%;margin-top:1.35rem;padding:.75rem;border:1px solid var(--a);
    background:var(--a);color:var(--on-accent);font-family:var(--font-sans);font-size:.78125rem;
    font-weight:600;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
    transition:background-color .2s ease,color .2s ease}
  button:hover{background:transparent;color:var(--a)}
  a.oidc{display:block;margin-top:.9rem;padding:.75rem;border:1px solid var(--fg);
    color:var(--fg);text-align:center;text-decoration:none;font-size:.78125rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;transition:background-color .2s ease,color .2s ease}
  a.oidc:hover{background:var(--fg);color:var(--bg)}
  .err{margin:0 0 1rem;padding:.6rem .75rem;border:1px solid var(--bad);color:var(--bad);
    font-family:var(--font-mono);font-size:.75rem;word-break:break-word}
  .sep{display:flex;align-items:center;gap:.7rem;margin-top:1.1rem;
    font-family:var(--font-mono);font-size:.625rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--fg-3)}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="grid-lines"></div>
  <div class="card">
    <div class="brand"><span class="brand__mark">RP</span><h1>revpro</h1></div>
    <p class="sub">reverse proxy manager</p>
    {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
    {{if .Local}}
    <form method="post" action="/login">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autofocus required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    {{end}}
    {{if and .Local .OIDC}}<div class="sep">or</div>{{end}}
    {{if .OIDC}}<a class="oidc" href="/oidc/start">Sign in with OIDC</a>{{end}}
  </div>
</body>
</html>
